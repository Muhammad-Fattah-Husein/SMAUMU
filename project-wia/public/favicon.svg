<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="favLeft" x1="12" y1="16" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="favRight" x1="52" y1="18" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Sunset Obsidian Badge -->
  <rect width="64" height="64" rx="16" fill="#121212" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#favBorder)" stroke-opacity="0.5" stroke-width="2" />

  <!-- Bintang Harapan di Puncak -->
  <path d="M32 9L34.2 14.5L39.8 16.7L34.2 18.9L32 24.4L29.8 18.9L24.2 16.7L29.8 14.5L32 9Z" fill="#E2E8F0" />

  <!-- Figur Pendamping / Sekolah (Sayap Kiri membentuk huruf U) -->
  <circle cx="18.8" cy="19.2" r="4.6" fill="#F97316" />
  <path d="M13.5 26.8C13.5 39.4 19.8 52.8 32 54C26.5 47.8 23.2 39 23.2 28C23.2 25.6 20.8 24.2 18.3 24.5C15.6 24.8 13.5 25.7 13.5 26.8Z" fill="url(#favLeft)" />

  <!-- Figur Siswa (Sayap Kanan menyambung huruf U) -->
  <circle cx="45.2" cy="20.8" r="4.2" fill="#F43F5E" />
  <path d="M50.5 28.2C50.5 40.4 44.2 52.8 32 54C37.5 47.8 40.8 39.8 40.8 29.5C40.8 27.1 43.2 25.7 45.7 26C48.4 26.3 50.5 27.2 50.5 28.2Z" fill="url(#favRight)" />

  <!-- Jembatan Genggaman Tangan & Senyum Kebersamaan -->
  <path d="M23.2 36.8C26.1 39.8 29 41.2 32 41.2C35 41.2 37.9 39.8 40.8 36.8" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
</svg>
