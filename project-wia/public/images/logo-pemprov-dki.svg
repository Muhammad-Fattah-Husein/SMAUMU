<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Official Government Crest Emblem -->
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M50 4 L88 18 C88 56 68 84 50 96 C32 84 12 56 12 18 Z" fill="url(#shieldBlue)" stroke="url(#crestGold)" stroke-width="3" />
  
  <!-- Inner Shield Accent -->
  <path d="M50 10 L82 22 C82 53 65 77 50 88 C35 77 18 53 18 22 Z" fill="#1E3A8A" opacity="0.9" stroke="#3B82F6" stroke-width="1" />
  
  <!-- Monumen Nasional / Obelisk Motif -->
  <polygon points="50,22 55,54 45,54" fill="url(#crestGold)" />
  <rect x="42" y="54" width="16" height="5" rx="1" fill="#FDE68A" />
  <rect x="38" y="59" width="24" height="6" rx="1.5" fill="url(#crestGold)" />
  
  <!-- Star on Top -->
  <polygon points="50,14 52,19 57,19 53,22 55,27 50,24 45,27 47,22 43,19 48,19" fill="#FEF08A" />
  
  <!-- Rice & Cotton Garland Motif -->
  <path d="M26 44 C24 58 32 72 48 78" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3" />
  <path d="M74 44 C76 58 68 72 52 78" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3" />

  <!-- Jaya Raya Banner Ribbon -->
  <path d="M28 80 Q50 86 72 80 L70 85 Q50 91 30 85 Z" fill="url(#crestGold)" />
</svg>
